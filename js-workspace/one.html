<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tineout & TimeInterval</title>
</head>
<body>
    <h1>This is old text</h1>
    <button id="stopButton">stop button</button>
</body>
<script>
    const stopButton = document.getElementById('stopButton');
    const h1 = document.querySelector('h1');
    
    const changeText = function(){
    h1.innerHTML = "This is new Text"
    }
    
    const changeHeading = setTimeout(changeText, 5000);

    stopButton.addEventListener('click', ()=> {
        clearTimeout(changeHeading);
        changeText();
        stopButton.innerHTML = "Start";
        stopButton.id = "startButton"
    });
</script>
</html>
